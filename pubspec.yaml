name: bulut_korsanlari
description: "Bulut Korsanları — sky-pirate flying game (dogfight, low-level raid, bombing run) built with Flutter and Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  audioplayers: ^6.8.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/images/chapters/
    - assets/images/missions/
    - assets/images/portraits/
